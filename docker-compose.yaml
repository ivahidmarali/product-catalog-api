services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - '5432:5432'
    volumes:
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog -d catalog']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://catalog:catalog@db:5432/catalog
      LOG_LEVEL: info
      WRITE_API_KEY: local-dev-key-change-me
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
